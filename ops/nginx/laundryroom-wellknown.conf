# /.well-known/did.json on every host of the laundryroom app, without redirect
#
# did:web:laundryroom.social (the appview's atproto identity) resolves to
# https://laundryroom.social/.well-known/did.json. The apex 301s everything to
# www, and atproto did:web resolvers fetch with redirect: "error", so this one
# path is proxied straight to the app instead (apps/nextjs serves it from
# src/app/.well-known/did.json/route.ts). /.well-known/acme-challenge/ is not
# affected: this is an exact-match location for a single path.
#
# dokku includes every *.conf in /home/dokku/laundryroom/nginx.conf.d/ in each
# server block of the app (apex and www, port 443 and port 80), and an exact
# `location =` match wins over the `location /` that proxies or redirects. It
# does NOT win over a redirect written at server level (a bare `return 301`
# or `rewrite` outside any location runs before locations are matched): if
# the curl check below still shows a 301, the apex redirect has to move into
# a `location / { return 301 ...; }` first.
#
# install (as the box owner, from the repo root):
#
#   scp ops/nginx/laundryroom-wellknown.conf falkenstein:/tmp/
#   ssh falkenstein 'sudo install -o dokku -g dokku -m 644 /tmp/laundryroom-wellknown.conf /home/dokku/laundryroom/nginx.conf.d/ && rm /tmp/laundryroom-wellknown.conf'
#   ssh falkenstein 'dokku proxy:build-config laundryroom'
#
# proxy:build-config regenerates the app's nginx.conf, runs `nginx -t` and only
# reloads nginx when the config is valid.
#
# check (must be 200, with no Location header, and the json must name
# did:web:laundryroom.social):
#
#   curl -sI https://laundryroom.social/.well-known/did.json
#   curl -s https://laundryroom.social/.well-known/did.json
#
# http://laundryroom-3000 is the upstream dokku generates for the app's port
# 3000 in the same nginx.conf.

location = /.well-known/did.json {
  proxy_pass http://laundryroom-3000;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
}
